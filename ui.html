<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Better Lessons · 课堂</title>
  <link rel="stylesheet" href="ui.css" />
</head>
<body data-art="fallback">
  <!-- 页面壳（§11.3）：与宿主主窗口同构 —— 上面 50px 是标题栏带，下面是内嵌的工作区卡片。
       窗口是透明的无边框窗口，圆角由 .page 自己画。 -->
  <div class="page">
    <!-- 自绘标题栏：标题左、回放胶囊居中、圆形窗口按钮右（宿主的形态） -->
    <header class="titlebar" id="titlebar">
      <span class="titlebar-title" id="titlebarTitle">Better Lessons</span>

      <!-- 回放控件（§14）：纯本地读盘重演，不经过模型。
           放标题栏是因为舞台的点击处理已经把 .titlebar 排除在外，不会误触发"推进一帧"。 -->
      <div class="titlebar-tools">
        <button class="pill" id="btnPickLesson" title="用文件选择器挑剧本（可选多个，按文件名顺序当作一整节课）">📂 打开剧本</button>
        <button class="pill" id="btnReplaySection" title="把这一节从头重演一遍">⟲ 本节</button>
        <button class="pill" id="btnReplayAll" title="清空黑板，按顺序重演整节课">⟲ 从头</button>
      </div>

      <!-- 窗口按钮：与宿主同一套圆形 30px 与同一组图标 -->
      <div class="window-controls">
        <button class="winbtn" data-win="win-minimize" title="最小化" aria-label="最小化">
          <svg width="10" height="2" viewBox="0 0 10 2" aria-hidden="true">
            <rect width="10" height="2" rx="1" fill="currentColor" />
          </svg>
        </button>
        <button class="winbtn" data-win="win-maximize" title="最大化 / 还原" aria-label="最大化或还原">
          <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
            <rect x="0.75" y="0.75" width="8.5" height="8.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.2" />
          </svg>
        </button>
        <button class="winbtn close" data-win="win-close" title="关闭" aria-label="关闭">
          <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
            <line x1="2" y1="2" x2="8" y2="8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
            <line x1="8" y1="2" x2="2" y2="8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
          </svg>
        </button>
      </div>
    </header>

    <!-- 舞台：教室背景 / 黑板 / 立绘 / 对话框 四层绝对定位（§11.1）。
         点击舞台任意处推进一帧；选中文字或操作滚动条时不推进。 -->
    <main class="stage" id="stage" aria-label="课堂舞台">
      <div class="classroom-bg" aria-hidden="true"></div>

      <section class="board" aria-label="黑板">
        <div class="board-frame" id="boardFrame">
          <!-- 板书面布双向可滚动（§8.5）：内容超长时滚动，而不是被裁掉 -->
          <div class="board-surface" id="boardSurface"></div>
          <div class="board-empty" id="boardEmpty">等待剧本推送…</div>
        </div>
      </section>

      <!-- 两个立绘槽（§9.2）：位置不同，所以不是"同一张图换一下"。
           talk 槽在右下近景、面向观众；board 槽在黑板前中景、完全背身。
           交叉过渡期间两个槽同时可见 —— "她走过去站到黑板前"就是靠这个读出来的。 -->
      <div class="figure figure-talk" id="figureTalk" data-on="0" data-missing="0" aria-hidden="true">
        <img class="figure-img" id="imgTalk" alt="" />
        <div class="figure-silhouette"></div>
      </div>

      <div
        class="figure figure-board"
        id="figureBoard"
        data-on="0"
        data-art="write"
        data-swing="0"
        data-missing="0"
        aria-hidden="true"
      >
        <!-- 槽内三帧：书写 / 擦板主帧 / 擦板挥舞差分。擦板两帧每 380ms 交替（§9.3） -->
        <img class="figure-img" id="imgWrite" alt="" />
        <img class="figure-img" id="imgErase" alt="" />
        <img class="figure-img" id="imgEraseSwing" alt="" />
        <div class="figure-silhouette"></div>
      </div>

      <section class="dialog" aria-label="对话框">
        <div class="dialog-box">
          <p class="dialog-text" id="dialogText">点击任意处开始。</p>
          <span class="dialog-hint" id="dialogHint">▽</span>
        </div>
      </section>

      <div class="notice" id="notice" hidden></div>

      <!-- 兜底补剧的轻标记（§6.3）：这一段不是主模型说的 -->
      <div class="fallback-badge" id="fallbackBadge" title="这一段由兜底补剧生成" hidden>兜底补剧</div>
    </main>
  </div>

  <script src="vendor/markdown-it.min.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script>
    const { ipcRenderer } = require("electron");
    const CH = (name) => "plugin:better-lessons:" + name;

    // ---------------------------------------------------------------- 美术素材
    // 全部素材由插件自带，不读宿主仓库（§9.1）。缺失的素材退回 CSS 程序化占位。
    const ASSETS = {
      classroom: "assets/classroom-bg.jpg",
      board: "assets/board.jpg",
      dialog: "assets/dialog-bg.png",
      talk: "assets/cyrene-talk.png",
      write: "assets/cyrene-write.png",
      erase: "assets/cyrene-erase.png",
      eraseSwing: "assets/cyrene-erase-swing.png",
    };

    /** key → 素材是否真的加载成功。缺了就切占位，而不是留一个破图。 */
    const assetOk = {};
    const loaded = {};

    function probe(url) {
      if (loaded[url]) return loaded[url];
      loaded[url] = new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve(true);
        img.onerror = () => resolve(false);
        img.src = url;
      });
      return loaded[url];
    }

    async function detectArt() {
      const entries = await Promise.all(
        Object.entries(ASSETS).map(async ([key, url]) => [key, await probe(url)]),
      );
      for (const [key, ok] of entries) {
        assetOk[key] = ok;
        document.body.classList.toggle("art-" + key, ok);
      }
      document.body.dataset.art = entries.every(([, ok]) => ok) ? "full" : "fallback";
    }

    // ---------------------------------------------------------------- markdown
    // 双层防线：markdown-it 关掉 html（模型写的原始 HTML 一律转义），
    // DOMPurify 再消一次毒（§3.3 / §16 —— 本窗口开了 nodeIntegration，一次 XSS 即任意代码执行）。
    const md = window.markdownit({
      html: false,
      linkify: false,
      breaks: false,
      typographer: false,
    });

    // 白名单必须覆盖 markdown-it 会产出的全部标签，否则内容会被静默剥掉。
    // 刻意排除 img：板书不需要图片，而放行等于让模型写的内容去发远程请求（这个窗口开着 nodeIntegration）。
    // 注意删除线是 <s>（markdown-it 的默认渲染），不是 <del>。
    //
    // ALLOW_DATA_ATTR 为 true 是**必要**的：行区间标注（data-line，见 installLineTagging）
    // 靠它才能穿过净化。这不会降低安全性——markdown-it 关掉了 html，模型写的原始标签一律被转义，
    // 所以输出里出现的 data-* 只可能来自我们自己的 renderer 规则。
    const PURIFY_CONFIG = {
      ALLOWED_TAGS: [
        "p", "br", "hr", "strong", "em", "del", "s", "code", "pre", "blockquote",
        "ul", "ol", "li", "h1", "h2", "h3", "h4", "h5", "h6",
        "table", "thead", "tbody", "tr", "th", "td", "a", "span",
      ],
      ALLOWED_ATTR: ["href", "title", "class"],
      ALLOW_DATA_ATTR: true,
    };

    /**
     * 给块级元素（含**列表项与表格行**）打上行区间 `data-line="start-end"`。
     *
     * 为什么必须细到列表项：一整段 40 项的 markdown 列表渲染出来只有一根 <ul>，
     * 如果只标到块一级，"第 20 行被强调"就只能定位到整根列表，
     * 于是"滚到新增内容底部""把强调行带到视野顶部"两个动作都会失准（实测踩过）。
     * markdown-it 的 list_item_open / tr_open 都带 map，所以能标到这一层。
     *
     * 代码块单独处理，见 installLineTagging 里的理由。
     */
    const TAGGED_RULES = [
      "paragraph_open", "heading_open", "blockquote_open",
      "bullet_list_open", "ordered_list_open", "list_item_open",
      "table_open", "tr_open", "hr",
    ];

    function installLineTagging() {
      const renderer = md.renderer;

      // 普通块：往 token 上塞属性，默认渲染器会把它写进标签
      for (const rule of TAGGED_RULES) {
        const original =
          renderer.rules[rule] ||
          ((tokens, idx, options) => renderer.renderToken(tokens, idx, options));
        renderer.rules[rule] = (tokens, idx, options, env, self) => {
          const token = tokens[idx];
          if (token.map) token.attrSet("data-line", `${token.map[0]}-${token.map[1]}`);
          return original(tokens, idx, options, env, self);
        };
      }

      // 代码块不能走上面那条路：markdown-it 的 fence 规则在围栏**带语言**时
      // （```cpp 这种）会另造一个只含 class 的假 token 去渲染 <code>，
      // 挂在真 token 上的属性会被直接丢掉。所以改成渲染完把属性注入 <pre>。
      for (const rule of ["fence", "code_block"]) {
        const original = renderer.rules[rule];
        renderer.rules[rule] = (tokens, idx, options, env, self) => {
          const token = tokens[idx];
          const output = original(tokens, idx, options, env, self);
          if (!token.map || output.indexOf("<pre") !== 0) return output;
          return output.replace("<pre>", `<pre data-line="${token.map[0]}-${token.map[1]}">`);
        };
      }
    }

    installLineTagging();

    function renderInline(source) {
      return window.DOMPurify.sanitize(
        md.renderInline(String(source == null ? "" : source)),
        PURIFY_CONFIG,
      );
    }

    /** 渲染整块板书（渲染单位是整篇文档，不是逐行，§8.2）。行区间已由 renderer 规则写在标签上。 */
    function renderBoardHtml(source) {
      const env = {};
      const tokens = md.parse(source, env);
      return window.DOMPurify.sanitize(md.renderer.render(tokens, md.options, env), PURIFY_CONFIG);
    }

    // ---------------------------------------------------------------- 视图

    const boardFrame = document.getElementById("boardFrame");
    const boardSurface = document.getElementById("boardSurface");
    const boardEmpty = document.getElementById("boardEmpty");
    const dialogText = document.getElementById("dialogText");
    const dialogHint = document.getElementById("dialogHint");
    const figureTalk = document.getElementById("figureTalk");
    const figureBoard = document.getElementById("figureBoard");
    const imgTalk = document.getElementById("imgTalk");
    const imgWrite = document.getElementById("imgWrite");
    const imgErase = document.getElementById("imgErase");
    const imgEraseSwing = document.getElementById("imgEraseSwing");
    const stageEl = document.getElementById("stage");

    /** 差分交替间隔（§9.3）：擦板是一个动作，两帧交替才读得出"在擦"。 */
    const SWING_MS = 380;
    /** 板书：走到黑板前之后的停留时长。 */
    const BOARD_HOLD_MS = 900;
    /** 擦板：停留期间差分交替 3 次（≈1140ms），比板书略长一点。 */
    const ERASE_HOLD_MS = SWING_MS * 3;
    // 这三个值就是"手感旋钮"，直接改即可，不影响其它逻辑。

    let swingTimer = null;
    let returnTimer = null;
    let currentSlot = null;

    /** 图片 src 只设一次，之后靠槽上的属性控制显隐，避免每次切换都重新解码。 */
    function primeFigures() {
      if (assetOk.talk !== false) imgTalk.src = ASSETS.talk;
      if (assetOk.write !== false) imgWrite.src = ASSETS.write;
      if (assetOk.erase !== false) imgErase.src = ASSETS.erase;
      if (assetOk.eraseSwing !== false) imgEraseSwing.src = ASSETS.eraseSwing;
    }

    /** 差分定时器只活在擦板停留期间 —— 离开必须清掉，否则窗口会一直空转（§9.3）。 */
    function setSwing(on) {
      const wanted = on === true && assetOk.eraseSwing !== false;
      if (wanted && !swingTimer) {
        swingTimer = setInterval(() => {
          figureBoard.dataset.swing = figureBoard.dataset.swing === "1" ? "0" : "1";
        }, SWING_MS);
      } else if (!wanted && swingTimer) {
        clearInterval(swingTimer);
        swingTimer = null;
      }
      if (!wanted) figureBoard.dataset.swing = "0";
    }

    /** 讲述槽向上轻跳一次（§9.3）：让每一次点击都有即时反馈。 */
    function bounce() {
      figureTalk.classList.remove("is-bounce");
      void figureTalk.offsetWidth; // 强制回流，让同一个 class 能重新触发动画
      figureTalk.classList.add("is-bounce");
    }

    function clearReturnTimer() {
      if (returnTimer) {
        clearTimeout(returnTimer);
        returnTimer = null;
      }
    }

    /** 交叉过渡只在**槽的开关真的变化时**才改，同槽内重复调用不触发淡入淡出（§9.3）。 */
    function applySlot(slot) {
      if (currentSlot === slot) return;
      currentSlot = slot;
      figureTalk.dataset.on = slot === "talk" ? "1" : "0";
      figureBoard.dataset.on = slot === "board" ? "1" : "0";
    }

    /** step → 立绘动作（§9.2）。纯函数，断点重绘时也用它算"该演什么"。 */
    function stageOf(step) {
      switch (step && step.kind) {
        case "boardBlock":
        case "boardReplace":
          return { slot: "board", art: "write" };
        case "boardClear":
          return { slot: "board", art: "erase" };
        default:
          return { slot: "talk" }; // say 与未知类型都回讲述
      }
    }

    /**
     * 立绘演出（§9.2 / §9.3）：**每次点击都是一次一次性演出，休息态永远是右下角的讲述**。
     *
     *   `{ slot: "talk" }`          她本来就在右下 → 只向上跳一下
     *   `{ slot: "board", art: "write" }`  过去写（停 900ms）→ 回来
     *   `{ slot: "board", art: "erase" }`  过去擦（停留期间差分交替 3 次）→ 回来
     *
     * 这不是"持续状态"：板书 / 擦板都是**短暂停留后自动回到讲述**。所以不存在"停在某个姿态不动"的情况。
     * `instant` 为真时（回放 / 瞬时重绘）不演，直接回休息态（§7.4）。
     * `bounce: false` 时不跳 —— 跳动只由**真正的 `say` step** 触发（§9.3）。
     */
    function playFigure(stage, options) {
      const instant = Boolean(options && options.instant);
      // 只有 say step 才跳：课后与"队列已空时再点击"都不跳
      const withBounce = !options || options.bounce !== false;
      const slot = stage && stage.slot;
      if (slot !== "talk" && slot !== "board") return;
      const art = stage.art === "erase" ? "erase" : "write";

      // 演出中再次点击：立刻打断上一次演出，按新的来（不排队，避免"点了没反应"）
      clearReturnTimer();

      if (instant) {
        stageEl.dataset.instant = "1";
        setSwing(false);
        figureTalk.dataset.missing = assetOk.talk === false ? "1" : "0";
        applySlot("talk"); // 休息态
        void figureTalk.offsetWidth; // 让"关掉 transition"这一帧先落地
        stageEl.dataset.instant = "0";
        return;
      }

      if (slot === "talk") {
        setSwing(false);
        figureTalk.dataset.missing = assetOk.talk === false ? "1" : "0";
        applySlot("talk");
        if (withBounce) bounce();
        return;
      }

      // 走到黑板前
      figureBoard.dataset.art = art;
      figureBoard.dataset.missing = assetOk[art] === false ? "1" : "0";
      if (art === "erase") {
        figureBoard.dataset.swing = "0"; // 每次擦板都从主帧起，避免停在挥出的姿势上
        setSwing(true);
      } else {
        setSwing(false);
      }
      applySlot("board");

      // 停一会儿，然后自己走回讲述 —— 这是与"持续状态"最本质的区别
      returnTimer = setTimeout(() => {
        returnTimer = null;
        setSwing(false);
        figureTalk.dataset.missing = assetOk.talk === false ? "1" : "0";
        applySlot("talk");
      }, art === "erase" ? ERASE_HOLD_MS : BOARD_HOLD_MS);
    }

    let boardLines = []; // 窗口侧对当前黑板的镜像，只用来算动画目标
    let boardSource = ""; // 最近一次渲染的板书正文，用来决定空板提示要不要露脸

    /**
     * 窗口是不是"什么都没收到"的开场态。
     *
     * 只有开场态才该出现「等待剧本推送…」：清板之后黑板是**真的空的**（不是又在等推送），
     * 模型推来剧本后第一帧还没铺开时也不该说"在等"——那时对话框会告诉用户点一下。
     * 所以一旦收到过推送 / 回放 / 已经播过，就永久退出开场态。
     */
    let idleEmpty = true;

    /** 收到内容、但一步都还没播（第一帧还没铺到黑板上）时给用户的话。 */
    const PUSH_HINT = "昔涟推送了一节课给你，点击进行下一步。";

    function refreshBoardEmpty() {
      boardEmpty.hidden = !(idleEmpty && boardSource.trim().length === 0);
    }

    function leaveIdle() {
      if (!idleEmpty) return;
      idleEmpty = false;
      refreshBoardEmpty();
    }

    function renderBoard(text, hint) {
      const body = String(text == null ? "" : text);
      boardLines = body.split("\n");
      boardSource = body;

      boardSurface.innerHTML = renderBoardHtml(body);

      refreshBoardEmpty();
      if (hint) animateBoard(hint);
    }

    /** 所有带行区间的元素，附解析好的行号（含列表项、表格行这类嵌套层级）。 */
    function lineElements() {
      return Array.from(boardSurface.querySelectorAll("[data-line]"))
        .map((el) => {
          const [start, end] = String(el.dataset.line).split("-").map(Number);
          return { el, start, end };
        })
        .filter((item) => Number.isFinite(item.start) && Number.isFinite(item.end));
    }

    /** 覆盖第 line 行的**最精确**元素（行区间最小的那个）。找不到返回 null。 */
    function findLineElement(line) {
      let best = null;
      for (const item of lineElements()) {
        if (line < item.start || line >= item.end) continue;
        if (!best || item.end - item.start < best.end - best.start) best = item;
      }
      return best ? best.el : null;
    }

    /** 从 fromLine 起往后找最后一个有归属的行（尾随空行不属于任何 token）。 */
    function findLastLineElement(fromLine) {
      for (let line = boardLines.length - 1; line >= fromLine; line -= 1) {
        const el = findLineElement(line);
        if (el) return el;
      }
      return null;
    }

    /**
     * 加动画类。
     * onlyOutermost 用来避免父子同时淡入：一段新追加的列表里，<ul> 与它的 40 个 <li>
     * 都命中了新行，但只该让最外层淡入一次，否则两层动画叠起来看着发虚。
     */
    function markElements(elements, className, onlyOutermost) {
      let list = elements;
      if (onlyOutermost) {
        list = elements.filter((el) => !elements.some((other) => other !== el && other.contains(el)));
      }
      for (const el of list) {
        el.classList.remove(className);
        void el.offsetWidth; // 强制重排，让动画能重播
        el.classList.add(className);
      }
    }

    /** 把元素带到指定位置（§8.5）。block 就是"要它停在哪"：nearest 贴最近边，start 贴视野顶部。 */
    function scrollIntoViewIfNeeded(el, block) {
      if (!el || typeof el.scrollIntoView !== "function") return;
      try {
        el.scrollIntoView({ block: block || "nearest", inline: "nearest" });
      } catch (err) {
        /* 老实现不支持参数对象时忽略；不影响播放 */
      }
    }

    /**
     * 新写的板书要"跟着粉笔走"：把新增内容的**末尾**带进视野。
     *
     * 不能对元素用 scrollIntoView("nearest")：40 项列表渲染出来只有一根 <ul>，
     * 它比视野还高、顶边本来就可见，nearest 会判定"不用滚"，用户于是什么也看不到。
     * 改成直接量：找到新增最后一行所在的元素，底边超出视野多少，就补多少 scrollTop。
     */
    function scrollNewContentIntoView(fromLine) {
      const last = findLastLineElement(fromLine);
      if (!last) return;
      const overflow =
        last.getBoundingClientRect().bottom - boardSurface.getBoundingClientRect().bottom;
      if (overflow > 0) boardSurface.scrollTop += overflow;
    }

    /** hint：{ kind: "block", fromLine } | { kind: "replace", line } | { kind: "clear" } */
    function animateBoard(hint) {
      if (hint.kind === "clear") {
        boardFrame.classList.remove("bl-cleared");
        void boardFrame.offsetWidth;
        boardFrame.classList.add("bl-cleared");
        setTimeout(() => boardFrame.classList.remove("bl-cleared"), 420);
        return;
      }

      if (hint.kind === "block") {
        markElements(
          lineElements()
            .filter((item) => item.start >= hint.fromLine)
            .map((item) => item.el),
          "bl-enter",
          true,
        );
        scrollNewContentIntoView(hint.fromLine);
        return;
      }

      if (hint.kind === "replace" && hint.line >= 0) {
        // 强调是"看这里"的手势：只闪那一行所在的元素，并把它带到视野顶部。
        // 行号在替换前后是稳定的（替换不增删行），所以可以用替换前的行号定位。
        const el = findLineElement(hint.line);
        if (el) {
          markElements([el], "bl-flash", false);
          scrollIntoViewIfNeeded(el, "start");
        }
      }
    }

    /** 旧文本里 `needle` 落在第几行（0 起）。找不到返回 -1。 */
    function lineIndexOf(text, needle) {
      const at = text.indexOf(needle);
      if (at < 0) return -1;
      return text.slice(0, at).split("\n").length - 1;
    }

    function setDialog(text) {
      dialogText.innerHTML = renderInline(text);
      dialogText.scrollTop = 0;
    }

    let noticeTimer = null;
    function showNotice(text) {
      const el = document.getElementById("notice");
      el.textContent = text;
      el.hidden = false;
      clearTimeout(noticeTimer);
      noticeTimer = setTimeout(() => {
        el.hidden = true;
      }, 4000);
    }

    function setHint(text) {
      dialogHint.textContent = text;
    }

    /** 兜底补剧的轻标记（§6.3）：跟着**当前这一层**走。 */
    function setFallbackBadge(on) {
      const el = document.getElementById("fallbackBadge");
      if (el) el.hidden = !on;
    }

    // ---------------------------------------------------------------- 推进

    let boundConversationId = null;
    let pushing = false;
    let currentFile = null; // 正在播（或刚播完）的剧本文件名，回放"本节"要用

    /** 把主进程算好的这一帧铺到界面上（§7.3 的返回形状见 rooms.advance）。 */
    function applyFrame(result) {
      if (result.kind === "done") {
        // 还是开场态就说明这一节课从头到尾什么都没有（回放播完再打开窗口也是这种局面）。
        // 这时点一下不是"这节课结束了"，而是"还没有课可上"——保持开场引导原样，别凭空宣布收课。
        if (idleEmpty) return;
        setDialog("这节课先到这里，随时可以再叫我。");
        // 队列空时 advance 会**持续**返回 done（之后再点也还是 done），所以这里不能跳 ——
        // 否则课后每点一次她都会弹一下。想看一遍请用「⟲ 本节」。
        playFigure({ slot: "talk" }, { bounce: false });
        setHint("【完】");
        setFallbackBadge(false);
        return;
      }

      // 只要有内容真的演到屏幕上了，黑板上的"空"就再也不是"在等推送"（收到过推送 / 回放的
      // 路径已经退出开场态，这里是兜底：推送事件万一没送达窗口，第一次点击也能纠正过来）。
      leaveIdle();

      if (result.kind === "transition") {
        // 过渡帧本身就是在清板（§9.2），所以立绘演一次"擦板"。
        // 过渡帧不属于任何一层，标记保持原样，等下一步再判。
        renderBoard(result.boardText, { kind: "clear" });
        setDialog(result.transition.text || "");
        playFigure({ slot: "board", art: "erase" });
        setHint("▽");
        return;
      }

      const step = result.step;
      const total = result.total;
      const base = `第 ${result.cursor}/${total} 步`;
      if (result.file) currentFile = result.file;
      setFallbackBadge(result.fallback === true);
      // 立绘演出与黑板渲染同时开始：她走过去的同时板书就在写。
      // 跳动只由真正的 say step 触发（§9.3）—— 未知类型不跳，避免"点了没反应"变成"乱弹"。
      playFigure(stageOf(step), { bounce: step.kind === "say" });

      switch (step.kind) {
        case "say":
          setDialog(step.text);
          break;

        case "boardBlock": {
          const fromLine = boardLines.length; // 必须在 renderBoard 之前取
          renderBoard(result.boardText, { kind: "block", fromLine });
          break;
        }

        case "boardReplace": {
          const line = lineIndexOf(boardLines.join("\n"), step.from);
          renderBoard(result.boardText, { kind: "replace", line });
          break;
        }

        case "boardClear":
          renderBoard(result.boardText, { kind: "clear" });
          break;

        default:
          renderBoard(result.boardText, null);
      }

      setHint("▽");
      document.getElementById("titlebarTitle").textContent = `${result.file}　·　${base}`;
    }

    async function advance() {
      if (pushing) return;
      pushing = true;
      try {
        const result = await ipcRenderer.invoke(CH("advance"), { conversationId: boundConversationId });
        if (!result || result.ok === false) {
          showNotice((result && result.reason) || "推进失败");
          return;
        }
        applyFrame(result);
      } catch (err) {
        showNotice(String(err && err.message ? err.message : err));
      } finally {
        pushing = false;
      }
    }

    // ---------------------------------------------------------------- 回放（§14）
    // 纯本地：读盘 → 解析 → 重排队，全程不经过模型，也不需要会话里有过任何回复。

    const btnPickLesson = document.getElementById("btnPickLesson");
    const btnReplaySection = document.getElementById("btnReplaySection");
    const btnReplayAll = document.getElementById("btnReplayAll");

    /** 回放后主进程那边黑板已经清空，窗口这边要立刻跟着清，别等下一次点击才看得出变化。 */
    function resetBoardView(boardText) {
      boardLines = [];
      renderBoard(boardText || "", { kind: "clear" });
    }

    /** 主进程统一回 { mode, files, skipped, boardText }，这里翻成一句人话。 */
    function describeReplay(res) {
      const files = res.files || [];
      const skipped = res.skipped && res.skipped.length ? `（${res.skipped.length} 个读不出来，已跳过）` : "";
      if (res.mode === "course") {
        return `这节课我们从头再看一遍，共 ${files.length} 节${skipped}。`;
      }
      return `这一节我们再看一遍：《${files[0] || "未知"}》${skipped}。`;
    }

    async function requestReplay(channel, payload) {
      const args = Object.assign({ conversationId: boundConversationId }, payload || {});
      try {
        const res = await ipcRenderer.invoke(CH(channel), args);
        if (!res || res.ok === false) {
          if (res && res.canceled) return; // 用户在文件选择器里点了取消，什么都不用说
          showNotice((res && res.reason) || "回放失败");
          return;
        }
        const text = describeReplay(res);
        leaveIdle(); // 回放同样是"收到内容了"，空板提示不该再出现
        resetBoardView(res.boardText);
        setDialog(text);
        // 回放从清板开始：立绘直接回休息态，**不演三拍**（瞬时重绘，§7.4）。
        // 第一次点击才会演出对应 step 的动作。
        playFigure({ slot: "talk" }, { instant: true });
        setHint("▽");
        // 队列已换成新的，标记跟着队首那一层走（第一步点击时还会再确认一次）
        setFallbackBadge(res.fallback === true);
        showNotice(text);
      } catch (err) {
        showNotice(String(err && err.message ? err.message : err));
      }
    }

    btnPickLesson.addEventListener("click", () => requestReplay("pick-lesson", {}));

    btnReplaySection.addEventListener("click", () => {
      if (!currentFile) {
        showNotice("还没有播过任何剧本，先点左边的「打开剧本」挑一个。");
        return;
      }
      requestReplay("replay", { file: currentFile });
    });

    btnReplayAll.addEventListener("click", () => requestReplay("replay-all", {}));

    stage.addEventListener("click", (event) => {
      if (event.target.closest(".titlebar") || event.target.closest("a")) return;
      // 正在选文本、或刚拖过滚动条时不要顺手把课推进一格
      const selection = window.getSelection();
      if (selection && !selection.isCollapsed) return;
      advance();
    });

    // ---------------------------------------------------------------- 主进程 → 窗口

    ipcRenderer.on(CH("bind"), (_event, payload) => {
      boundConversationId = payload && payload.conversationId ? payload.conversationId : null;
    });

    ipcRenderer.on(CH("push"), (_event, payload) => {
      const layer = payload && payload.layer;
      if (!layer) return;
      // 队列在主进程里，窗口不复制一份；这里只做提示，下一次点击会先演过渡帧
      const mode = payload.mode === "append" ? "排在后面" : "马上讲";
      showNotice(`昔涟推来新的一层《${layer.file}》（${mode}，${layer.steps.length} 步）`);
      // 还没收到过任何内容：这一层就是用户的第一节课，黑板这会儿是空的（第一帧还没铺），
      // 但"什么都没收到"已经不是事实 —— 收起空板提示，把开场引导换成"点一下"。
      // 播放中插话推送时 idleEmpty 早已是 false，对话框里那一句对白不会被顶掉。
      if (idleEmpty) {
        leaveIdle();
        setDialog(PUSH_HINT);
      }
      setHint("▽");
    });

    ipcRenderer.on(CH("restore"), (_event, payload) => {
      // 跨会话切换绑定时主进程会把那个房间已有的现场发过来；帧队列本来就在主进程里，不用还原。
      // TODO(P1): 持久化恢复（§13）还要把 cursor 一起对回去。
      leaveIdle();
      if (payload && typeof payload.board === "string") renderBoard(payload.board, null);
      showNotice("已切换到这个会话的课堂");
    });

    ipcRenderer.on(CH("notice"), (_event, payload) => {
      if (payload && payload.text) showNotice(payload.text);
    });

    // ---------------------------------------------------------------- 接线

    document.querySelectorAll("[data-win]").forEach((button) => {
      button.addEventListener("click", () => {
        ipcRenderer.invoke(CH(button.dataset.win)).catch(() => {});
      });
    });
    document.getElementById("titlebar").addEventListener("dblclick", (event) => {
      if (event.target.closest(".winbtn")) return;
      ipcRenderer.invoke(CH("win-maximize")).catch(() => {});
    });

    // 跳动动画结束后摘掉 class，否则同一个 class 无法再次触发（bounce() 里也会先删一次）
    figureTalk.addEventListener("animationend", () => figureTalk.classList.remove("is-bounce"));

    // 供 DevTools 手工验证窗口壳体用
    window.__bl = { renderBoard, setDialog, playFigure, stageOf, showNotice, applyFrame };

    detectArt().finally(async () => {
      primeFigures();
      playFigure({ slot: "talk" }, { instant: true }); // 开场不演三拍、也不跳
      renderBoard("");
      setDialog("点「📂 打开剧本」挑一个剧本，或者等昔涟推给你。");
      setHint("▽");
      try {
        const state = await ipcRenderer.invoke(CH("state"));
        boundConversationId = (state && state.boundConversationId) || null;
        // 窗口被关掉又打开时，那间课堂可能还有**没播完**的内容：那就不是开场态 ——
        // 板书要等下一次点击才会重铺到窗口上，但这时的"空"是"还没铺"，不是"在等推送"。
        //
        // 判据只认"队列里还有东西"，**不认这个房间讲过课**：一节课播完（frames 清空）之后
        // 再打开窗口，用户手里确实什么都没有了，那就该老老实实回到开场态，
        // 否则会说出一句"昔涟推送了一节课给你"，而昔涟其实什么都没推。
        const room = ((state && state.rooms) || []).find(
          (item) => item.conversationId === boundConversationId,
        );
        if (room && room.frames > 0) {
          leaveIdle();
          setDialog(PUSH_HINT);
        }
      } catch (err) {
        /* 状态拿不到不影响观看，等第一次 advance 时再报 */
      }
    });
  </script>
</body>
</html>
